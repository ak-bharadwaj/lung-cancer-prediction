version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catgbm-lung-cancer-prediction
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped
